<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
    <section id="container">
        <h1 class="app-title">URL Shortener</h1>

        <input type="url" name="url" id="url-input-field" placeholder="Enter URL to shorten" autofocus required>
        
        <div id="copydiv">
            <div id="result-container">
                <p id="result"></p> 
                <button id="copy">
                    <img src="./src/copy-white.png" alt="copy icon" class="icon">
                </button>
            </div>
            <div class="copied-div">
                <span id="copied">Copied!</span>
            </div>
        </div>

        <div class="submit-btn-container">
            <button type="button" id="submit-btn">Submit URL</button>
        </div>

    </section>
</body>
</html>
